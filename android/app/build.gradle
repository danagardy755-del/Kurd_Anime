plugins { id 'com.android.application' }
android { namespace 'com.kurdanime.app'; compileSdk 35
 defaultConfig { applicationId 'com.kurdanime.app'; minSdk 24; targetSdk 35; versionCode 5; versionName '0.5.0' }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
