<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111b">
<title>Kurd Anime</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{background:#06111b;color:#fff}
.startup-fallback{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.startup-fallback .logo{font-weight:950;font-size:42px;line-height:.9;margin-bottom:20px}
.startup-fallback .logo b{color:#ff2148}
.startup-fallback h1{font-size:24px;margin:10px 0;color:#ff2148}
.startup-fallback p{color:#b8c4cf;line-height:1.8;margin:0;max-width:360px}
.startup-fallback .fallback-btn{margin-top:22px;border:0;border-radius:14px;background:#ff2148;color:#fff;padding:13px 24px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <main class="startup-fallback">
    <div class="logo">KURD<br><b>ANIME</b></div>
    <h1>بەخێربێیت بۆ Kurd Anime</h1>
    <p>ئەپەکە خەریکی بارکردنە. تکایە چاوەڕێ بکە...</p>
    <button class="fallback-btn" type="button" onclick="location.reload()">دووبارە بارکردنەوە</button>
  </main>
</div>
<script src="theme.js"></script>
<script src="logo.js"></script>
<script src="app.js"></script>
<script src="brand-fix.js"></script>
</body>
</html>
